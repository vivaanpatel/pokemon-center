name: Deploy to Wix Headless

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Release
    runs-on: ubuntu-latest

    env:
      WIX_CLIENT_ID: ${{ secrets.WIX_CLIENT_ID }}
      WIX_CLIENT_INSTANCE_ID: ${{ secrets.WIX_CLIENT_INSTANCE_ID }}
      WIX_CLIENT_SECRET: ${{ secrets.WIX_CLIENT_SECRET }}
      WIX_CLIENT_PUBLIC_KEY: ${{ secrets.WIX_CLIENT_PUBLIC_KEY }}
      WIX_CLOUD_PROVIDER: KUBERNETES

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Login to Wix CLI
        run: npx @wix/cli@latest login --api-key ${{ secrets.WIX_API_KEY }}

      - name: Build
        run: npm run build

      - name: Release to Wix
        run: npm run release
